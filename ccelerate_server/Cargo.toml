[package]
name = "ccelerate_server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.14.0"
anyhow = "1.0.103"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
ccelerate_shared = { path = "../ccelerate_shared" }
base64 = "0.22.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
parking_lot = "0.12.5"
rusqlite_migration = "1.3.1"
ratatui = "0.29.0"
crossterm = "0.28.1"
scopeguard = "1.2.0"
include_dir = "0.7.4"
tempfile = "3.27.0"
rayon = "1.12.0"
uuid = { version = "1.23.4", features = ["v4"] }
clap = { version = "4.6.1", features = ["derive"] }
log = "0.4.33"
regex = "1.12.4"
once_cell = "1.21.4"
twox-hash = "2.1.2"
bstr = { version = "1.12.3", features = ["serde"] }
toml = "0.8.23"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.32"
async-recursion = "1.1.1"
glob = "0.3.3"
os_str_bytes = "7.2.0"
smallvec = "1.15.2"
nunny = "0.2.2"
